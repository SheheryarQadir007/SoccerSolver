[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "soccersolver"
version = "1.0.0"
description = "AI-powered player valuation and transfer market decision-making agent"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "pydantic>=2.6.0",
    "numpy>=1.26.0",
    "scipy>=1.12.0",
    "pulp>=2.8.0",
    "pandas>=2.2.0",
    "httpx>=0.27.0",
    "jinja2>=3.1.3",
    "click>=8.1.7",
    "python-multipart>=0.0.9",
]

[project.scripts]
soccersolver = "soccersolver.cli:cli"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
